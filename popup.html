<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fanyi</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="panel">
        <label class="setting-row selection-row" for="selection-enabled">
          <span class="setting-icon mint">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 4 11 8-5 1 3 6-2.5 1.2-3-6L5 18V4Z"/></svg>
          </span>
          <span class="setting-copy">
            <strong>划词翻译</strong>
            <small>选中文本后显示翻译卡片</small>
          </span>
          <span class="switch"><input id="selection-enabled" type="checkbox" /><span></span></span>
        </label>

        <div class="language-row">
          <label>
            <span>源语言</span>
            <select id="source-language" aria-label="源语言"></select>
          </label>
          <button id="swap-languages" class="swap-button" title="交换语言" aria-label="交换语言">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7-3 3 3 3"/><path d="M4 10h13a3 3 0 0 1 3 3v1"/><path d="m17 17 3-3-3-3"/></svg>
          </button>
          <label>
            <span>译为</span>
            <select id="target-language" aria-label="目标语言"></select>
          </label>
        </div>

        <label class="service-row" for="provider">
          <span>翻译服务</span>
          <select id="provider" aria-label="翻译服务">
            <option value="google">Google 公共服务</option>
            <option value="openai">OpenAI 兼容接口</option>
          </select>
        </label>
      </section>

      <p class="service-hint" id="provider-hint" hidden>还没有填写 API Key，<button id="open-key-settings">前往设置</button></p>

      <button class="action-button" id="translate-page" aria-pressed="false">翻译</button>

      <footer class="app-footer">
        <span><kbd>⌥</kbd><kbd>⇧</kbd><kbd>F</kbd> 快速翻译网页</span>
        <button id="open-options">更多设置 <span>→</span></button>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
